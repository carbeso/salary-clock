<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 外層圓角背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- 發光外環 (時鐘軌道) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-dasharray="16 10" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-dasharray="16 10"/>
  
  <!-- 金幣主體 -->
  <circle cx="256" cy="256" r="136" fill="url(#goldGrad)"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#fef08a" stroke-width="6" opacity="0.6"/>
  
  <!-- 錢幣符號 💰 / 時鐘指針整合設計 -->
  <g fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="140" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="260">NT$</text>
  </g>
  
  <!-- 刻度亮點 -->
  <circle cx="256" cy="92" r="8" fill="#10b981"/>
  <circle cx="420" cy="256" r="8" fill="#6366f1"/>
  <circle cx="256" cy="420" r="8" fill="#10b981"/>
  <circle cx="92" cy="256" r="8" fill="#6366f1"/>
</svg>
